# Organ Deployment: killinchu
# Source: protected main cc49a0cc5fa03405fc7894c64040e013911a63bc
# Image: ghcr.io/szl-holdings/killinchu@sha256:1620a0f38054121f1c11705889bc17ed376412934387f07358f354e5d1a0d2c9
# Supply-chain gate: initContainer runs cosign verify + slsa-verifier. FAIL-CLOSED.
# The image is private on GHCR. bootstrap/configure-ghcr-pull-auth.py creates the
# runtime-only Secret this Deployment requires; credentials are never committed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: killinchu
  namespace: szl
  labels:
    app: killinchu
    szl.organ: "killinchu"
    szl.doctrine: "v11-749-14-163-c7c0ba17"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: killinchu
  template:
    metadata:
      labels:
        app: killinchu
        szl.organ: "killinchu"
    spec:
      # Only this private-image pod may use the registry credential. The main
      # application container does not receive the Secret as a mounted volume.
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: szl-ghcr-pull
      # cosign public key for the supply-chain gate (NOT a secret — public key only)
      volumes:
        - name: cosign-pub
          configMap:
            name: szl-cosign-pub
        - name: registry-auth
          secret:
            secretName: szl-ghcr-pull
            items:
              - key: .dockerconfigjson
                path: config.json
      initContainers:
        - name: cosign-gate
          image: ghcr.io/sigstore/cosign/cosign:v2.4.1
          # Keyless (Fulcio) verify. The cosign distroless image has no shell, so we
          # run its `cosign` entrypoint directly via args (no /bin/sh). The pod fails
          # to start unless the signature verifies against the organ's ghcr-build-push
          # workflow identity. Authoritative host gate: verify/cosign-init.sh.
          args:
            - "verify"
            - "--certificate-identity"
            - "https://github.com/szl-holdings/killinchu/.github/workflows/ghcr-build-push.yml@refs/heads/main"
            - "--certificate-oidc-issuer"
            - "https://token.actions.githubusercontent.com"
            - "--certificate-github-workflow-repository"
            - "szl-holdings/killinchu"
            - "--certificate-github-workflow-ref"
            - "refs/heads/main"
            - "--certificate-github-workflow-sha"
            - "cc49a0cc5fa03405fc7894c64040e013911a63bc"
            - "--certificate-github-workflow-trigger"
            - "push"
            - "ghcr.io/szl-holdings/killinchu@sha256:1620a0f38054121f1c11705889bc17ed376412934387f07358f354e5d1a0d2c9"
          env:
            - { name: ORGAN_NAME,  value: "killinchu" }
            - { name: ORGAN_IMAGE, value: "ghcr.io/szl-holdings/killinchu@sha256:1620a0f38054121f1c11705889bc17ed376412934387f07358f354e5d1a0d2c9" }
            - { name: DOCKER_CONFIG, value: "/registry-auth" }
          volumeMounts:
            - { name: cosign-pub, mountPath: /keys, readOnly: true }
            - { name: registry-auth, mountPath: /registry-auth, readOnly: true }
      containers:
        - name: killinchu
          image: ghcr.io/szl-holdings/killinchu@sha256:1620a0f38054121f1c11705889bc17ed376412934387f07358f354e5d1a0d2c9
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 7860, name: http }
          env:
            # OTLP export so this organ's spans join the cross-organ trace
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://opentelemetry-collector.szl.svc:4318" }
            - { name: OTEL_SERVICE_NAME,           value: "killinchu" }
            - { name: OTEL_TRACES_EXPORTER,        value: "otlp" }
            - { name: SZL_ORGAN,                   value: "killinchu" }
          readinessProbe:
            httpGet: { path: /api/killinchu/healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/killinchu/healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: killinchu
  namespace: szl
  labels:
    app: killinchu
spec:
  selector:
    app: killinchu
  ports:
    - { name: http, port: 8080, targetPort: http }
