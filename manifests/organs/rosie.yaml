# Organ Deployment: rosie
# Source: signed historical tag; source repository is currently unavailable 97be4e52695e8141036b1c4269a4722148852d4a
# Image: ghcr.io/szl-holdings/rosie@sha256:1984a15f53c2e1b91c7dafaa0ed5df9148d57e3e86eb73db879c2b0443302848
# Supply-chain gate: initContainer runs cosign verify + slsa-verifier. FAIL-CLOSED.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rosie
  namespace: szl
  labels:
    app: rosie
    szl.organ: "rosie"
    szl.doctrine: "v11-749-14-163-c7c0ba17"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rosie
  template:
    metadata:
      labels:
        app: rosie
        szl.organ: "rosie"
    spec:
      automountServiceAccountToken: false
      # cosign public key for the supply-chain gate (NOT a secret — public key only)
      volumes:
        - name: cosign-pub
          configMap:
            name: szl-cosign-pub
      initContainers:
        - name: cosign-gate
          image: ghcr.io/sigstore/cosign/cosign:v2.4.1
          # Keyless (Fulcio) verify. The cosign distroless image has no shell, so we
          # run its `cosign` entrypoint directly via args (no /bin/sh). The pod fails
          # to start unless the signature verifies against the organ's ghcr-build-push
          # workflow identity. Authoritative host gate: verify/cosign-init.sh.
          args:
            - "verify"
            - "--certificate-identity"
            - "https://github.com/szl-holdings/rosie/.github/workflows/ghcr-build-push.yml@refs/tags/uds-v0.3.1"
            - "--certificate-oidc-issuer"
            - "https://token.actions.githubusercontent.com"
            - "--certificate-github-workflow-repository"
            - "szl-holdings/rosie"
            - "--certificate-github-workflow-ref"
            - "refs/tags/uds-v0.3.1"
            - "--certificate-github-workflow-sha"
            - "97be4e52695e8141036b1c4269a4722148852d4a"
            - "--certificate-github-workflow-trigger"
            - "push"
            - "ghcr.io/szl-holdings/rosie@sha256:1984a15f53c2e1b91c7dafaa0ed5df9148d57e3e86eb73db879c2b0443302848"
          env:
            - { name: ORGAN_NAME,  value: "rosie" }
            - { name: ORGAN_IMAGE, value: "ghcr.io/szl-holdings/rosie@sha256:1984a15f53c2e1b91c7dafaa0ed5df9148d57e3e86eb73db879c2b0443302848" }
          volumeMounts:
            - { name: cosign-pub, mountPath: /keys, readOnly: true }
      containers:
        - name: rosie
          image: ghcr.io/szl-holdings/rosie@sha256:1984a15f53c2e1b91c7dafaa0ed5df9148d57e3e86eb73db879c2b0443302848
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 7860, name: http }
          env:
            # OTLP export so this organ's spans join the cross-organ trace
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://opentelemetry-collector.szl.svc:4318" }
            - { name: OTEL_SERVICE_NAME,           value: "rosie" }
            - { name: OTEL_TRACES_EXPORTER,        value: "otlp" }
            - { name: SZL_ORGAN,                   value: "rosie" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: rosie
  namespace: szl
  labels:
    app: rosie
spec:
  selector:
    app: rosie
  ports:
    - { name: http, port: 8080, targetPort: http }
