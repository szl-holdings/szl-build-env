# Organ Deployment: a11oy
# Source: signed protected-main build bab6cbec341f4206edf22d13e93af690f656650f; five-organ trace acceptance pending
# Image: ghcr.io/szl-holdings/a11oy@sha256:c08839a06002b88c7c5c11dc8140099f8dd56ba0a618c1b5457bdedf17404cef
# Supply-chain gate: initContainer runs cosign verify + slsa-verifier. FAIL-CLOSED.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: a11oy
  namespace: szl
  labels:
    app: a11oy
    szl.organ: "a11oy"
    szl.doctrine: "v11-749-14-163-c7c0ba17"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: a11oy
  template:
    metadata:
      labels:
        app: a11oy
        szl.organ: "a11oy"
    spec:
      automountServiceAccountToken: false
      # cosign public key for the supply-chain gate (NOT a secret — public key only)
      volumes:
        - name: cosign-pub
          configMap:
            name: szl-cosign-pub
      initContainers:
        - name: cosign-gate
          # Match the GHCR publisher's Cosign v3 OCI-referrer format.
          # Exact immutable index digest; the signed organ is still separately pinned.
          image: ghcr.io/sigstore/cosign/cosign@sha256:0f06154836d2de34f887a5c273506d52ca43edaa1d9e53e6510fa78a48f69c2d
          # Keyless (Fulcio) verify. The cosign distroless image has no shell, so we
          # run its `cosign` entrypoint directly via args (no /bin/sh). The pod fails
          # to start unless the signature verifies against the organ's ghcr-build-push
          # workflow identity. Authoritative host gate: verify/cosign-init.sh.
          args:
            - "verify"
            - "--certificate-identity"
            - "https://github.com/szl-holdings/a11oy/.github/workflows/ghcr-build-push.yml@refs/heads/main"
            - "--certificate-oidc-issuer"
            - "https://token.actions.githubusercontent.com"
            - "--certificate-github-workflow-repository"
            - "szl-holdings/a11oy"
            - "--certificate-github-workflow-ref"
            - "refs/heads/main"
            - "--certificate-github-workflow-sha"
            - "bab6cbec341f4206edf22d13e93af690f656650f"
            - "--certificate-github-workflow-trigger"
            - "push"
            - "ghcr.io/szl-holdings/a11oy@sha256:c08839a06002b88c7c5c11dc8140099f8dd56ba0a618c1b5457bdedf17404cef"
          env:
            - { name: ORGAN_NAME,  value: "a11oy" }
            - { name: ORGAN_IMAGE, value: "ghcr.io/szl-holdings/a11oy@sha256:c08839a06002b88c7c5c11dc8140099f8dd56ba0a618c1b5457bdedf17404cef" }
          volumeMounts:
            - { name: cosign-pub, mountPath: /keys, readOnly: true }
      containers:
        - name: a11oy
          image: ghcr.io/szl-holdings/a11oy@sha256:c08839a06002b88c7c5c11dc8140099f8dd56ba0a618c1b5457bdedf17404cef
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 7860, name: http }
          env:
            # The pinned source's vsp_otel middleware uses OTLP/gRPC, not HTTP.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://opentelemetry-collector.szl.svc:4317" }
            # vsp_otel only admits explicit DNS hosts; scope this to the CI kind collector.
            - { name: A11OY_OTEL_ALLOWED_HOSTS,   value: "opentelemetry-collector.szl.svc" }
            - { name: OTEL_SERVICE_NAME,           value: "a11oy" }
            - { name: OTEL_TRACES_EXPORTER,        value: "otlp" }
            # Isolated kind five-organ acceptance only; production stays opt-out.
            - { name: A11OY_BUILD_ENV_FANOUT,      value: "1" }
            - { name: SZL_ORGAN,                   value: "a11oy" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          # Signed image bab6cbec embeds a verified 986,047,904-byte GGUF.
          # CI 44118532387 observed exit=137 / OOMKilled under the 512Mi cap.
          # Budget room for model residency plus Python server overhead; fail
          # readiness independently rather than interpreting an OOM as pass.
          resources:
            requests: { cpu: "100m", memory: "1Gi" }
            limits:   { cpu: "1", memory: "3Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: a11oy
  namespace: szl
  labels:
    app: a11oy
spec:
  selector:
    app: a11oy
  ports:
    - { name: http, port: 8080, targetPort: http }
