# Organ Deployment: amaru
# Source: signed historical source; source repository is currently unavailable 324c3d60c2e2195e89cfefb28613ff26d94e67f8
# Image: ghcr.io/szl-holdings/amaru@sha256:53301e26adcde49e73df28d8c3b790f2496da9d495307fe8587ffa7452b289ff
# Supply-chain gate: initContainer runs cosign verify + slsa-verifier. FAIL-CLOSED.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amaru
  namespace: szl
  labels:
    app: amaru
    szl.organ: "amaru"
    szl.doctrine: "v11-749-14-163-c7c0ba17"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amaru
  template:
    metadata:
      labels:
        app: amaru
        szl.organ: "amaru"
    spec:
      automountServiceAccountToken: false
      # cosign public key for the supply-chain gate (NOT a secret — public key only)
      volumes:
        - name: cosign-pub
          configMap:
            name: szl-cosign-pub
      initContainers:
        - name: cosign-gate
          image: ghcr.io/sigstore/cosign/cosign:v2.4.1
          # Keyless (Fulcio) verify. The cosign distroless image has no shell, so we
          # run its `cosign` entrypoint directly via args (no /bin/sh). The pod fails
          # to start unless the signature verifies against the organ's ghcr-build-push
          # workflow identity. Authoritative host gate: verify/cosign-init.sh.
          args:
            - "verify"
            - "--certificate-identity"
            - "https://github.com/szl-holdings/amaru/.github/workflows/ghcr-build-push.yml@refs/heads/main"
            - "--certificate-oidc-issuer"
            - "https://token.actions.githubusercontent.com"
            - "--certificate-github-workflow-repository"
            - "szl-holdings/amaru"
            - "--certificate-github-workflow-ref"
            - "refs/heads/main"
            - "--certificate-github-workflow-sha"
            - "324c3d60c2e2195e89cfefb28613ff26d94e67f8"
            - "--certificate-github-workflow-trigger"
            - "push"
            - "ghcr.io/szl-holdings/amaru@sha256:53301e26adcde49e73df28d8c3b790f2496da9d495307fe8587ffa7452b289ff"
          env:
            - { name: ORGAN_NAME,  value: "amaru" }
            - { name: ORGAN_IMAGE, value: "ghcr.io/szl-holdings/amaru@sha256:53301e26adcde49e73df28d8c3b790f2496da9d495307fe8587ffa7452b289ff" }
          volumeMounts:
            - { name: cosign-pub, mountPath: /keys, readOnly: true }
      containers:
        - name: amaru
          image: ghcr.io/szl-holdings/amaru@sha256:53301e26adcde49e73df28d8c3b790f2496da9d495307fe8587ffa7452b289ff
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 7860, name: http }
          env:
            # OTLP export so this organ's spans join the cross-organ trace
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://opentelemetry-collector.szl.svc:4318" }
            - { name: OTEL_SERVICE_NAME,           value: "amaru" }
            - { name: OTEL_TRACES_EXPORTER,        value: "otlp" }
            - { name: SZL_ORGAN,                   value: "amaru" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: amaru
  namespace: szl
  labels:
    app: amaru
spec:
  selector:
    app: amaru
  ports:
    - { name: http, port: 8080, targetPort: http }
