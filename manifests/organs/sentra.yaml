# Organ Deployment: sentra
# Source: signed historical source; source repository is currently unavailable 84c24336f7ce00aeda454c213c08da38f53e4c45
# Image: ghcr.io/szl-holdings/sentra@sha256:60a0efc14366ba392bfe3f3cd4196863fe148bb87a17428be6a57f0a05ac3639
# Supply-chain gate: initContainer runs cosign verify + slsa-verifier. FAIL-CLOSED.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentra
  namespace: szl
  labels:
    app: sentra
    szl.organ: "sentra"
    szl.doctrine: "v11-749-14-163-c7c0ba17"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentra
  template:
    metadata:
      labels:
        app: sentra
        szl.organ: "sentra"
    spec:
      automountServiceAccountToken: false
      # cosign public key for the supply-chain gate (NOT a secret — public key only)
      volumes:
        - name: cosign-pub
          configMap:
            name: szl-cosign-pub
      initContainers:
        - name: cosign-gate
          image: ghcr.io/sigstore/cosign/cosign:v2.4.1
          # Keyless (Fulcio) verify. The cosign distroless image has no shell, so we
          # run its `cosign` entrypoint directly via args (no /bin/sh). The pod fails
          # to start unless the signature verifies against the organ's ghcr-build-push
          # workflow identity. Authoritative host gate: verify/cosign-init.sh.
          args:
            - "verify"
            - "--certificate-identity"
            - "https://github.com/szl-holdings/sentra/.github/workflows/ghcr-build-push.yml@refs/heads/main"
            - "--certificate-oidc-issuer"
            - "https://token.actions.githubusercontent.com"
            - "--certificate-github-workflow-repository"
            - "szl-holdings/sentra"
            - "--certificate-github-workflow-ref"
            - "refs/heads/main"
            - "--certificate-github-workflow-sha"
            - "84c24336f7ce00aeda454c213c08da38f53e4c45"
            - "--certificate-github-workflow-trigger"
            - "push"
            - "ghcr.io/szl-holdings/sentra@sha256:60a0efc14366ba392bfe3f3cd4196863fe148bb87a17428be6a57f0a05ac3639"
          env:
            - { name: ORGAN_NAME,  value: "sentra" }
            - { name: ORGAN_IMAGE, value: "ghcr.io/szl-holdings/sentra@sha256:60a0efc14366ba392bfe3f3cd4196863fe148bb87a17428be6a57f0a05ac3639" }
          volumeMounts:
            - { name: cosign-pub, mountPath: /keys, readOnly: true }
      containers:
        - name: sentra
          image: ghcr.io/szl-holdings/sentra@sha256:60a0efc14366ba392bfe3f3cd4196863fe148bb87a17428be6a57f0a05ac3639
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 7860, name: http }
          env:
            # OTLP export so this organ's spans join the cross-organ trace
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://opentelemetry-collector.szl.svc:4318" }
            - { name: OTEL_SERVICE_NAME,           value: "sentra" }
            - { name: OTEL_TRACES_EXPORTER,        value: "otlp" }
            - { name: SZL_ORGAN,                   value: "sentra" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: sentra
  namespace: szl
  labels:
    app: sentra
spec:
  selector:
    app: sentra
  ports:
    - { name: http, port: 8080, targetPort: http }
