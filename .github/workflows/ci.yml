name: ci
# PR CI: stand up the build env in kind and run the honest supply-chain gate.
# Doctrine v11 749/14/163 @ c7c0ba17. NOT Iron Bank. SLSA L1 honest (L2 not yet produced).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read   # read-only: authenticate the private killinchu pull in CI.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsse-verify:
    # Fast, hermetic unit gate for the REAL DSSE verifier (verify/dsse_verify.py).
    # No cluster needed; proves verified / unsigned-honest / FAIL verdicts.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install verifier deps (szl-receipt + pytest)
        run: |
          python -m pip install --upgrade pip
          pip install pytest PyYAML "git+https://github.com/szl-holdings/szl-receipt.git@v0.1.0"
      - name: Run DSSE verifier tests
        run: >-
          pytest -q
          verify/test_dsse_verify.py
          verify/test_run_acceptance_contract.py
          verify/test_registry_auth_contract.py

  build-env:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject forked private-image acceptance
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "::error::Private-image acceptance requires a branch in this repository and fails closed for forks."
          exit 1

      - name: Install kind
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          version: v0.32.0
          cluster_name: szl-build-env
          config: kind/cluster.yaml
          wait: 120s

      - name: Install tools (kubectl, cosign, slsa-verifier, jq)
        run: |
          set -euo pipefail
          # kubectl
          curl -sSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl
          # cosign
          curl -sSLo /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64"
          chmod +x /usr/local/bin/cosign
          # slsa-verifier
          curl -sSLo /usr/local/bin/slsa-verifier "https://github.com/slsa-framework/slsa-verifier/releases/download/v2.6.0/slsa-verifier-linux-amd64"
          chmod +x /usr/local/bin/slsa-verifier
          sudo apt-get update -y && sudo apt-get install -y jq

      - name: Load cosign public key into the cluster
        run: make cosign-key

      - name: Configure least-privilege killinchu registry auth
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | \
            python3 bootstrap/configure-ghcr-pull-auth.py \
              --username "$GHCR_USERNAME" \
              --docker-config-dir "${RUNNER_TEMP}/szl-ghcr-auth"

      - name: make up (kind + istio ambient + otel + organs)
        run: make up

      - name: make verify (honest cosign + SLSA gate)
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/szl-ghcr-auth
        run: make verify

      - name: Remove host-side registry auth
        if: ${{ always() }}
        run: |
          auth_config="${RUNNER_TEMP}/szl-ghcr-auth/config.json"
          if [[ -f "$auth_config" ]]; then
            chmod u+w "$auth_config"
            rm -- "$auth_config"
          fi

      - name: Run fail-closed five-organ acceptance
        env:
          ACCEPTANCE_EVIDENCE_PATH: ${{ runner.temp }}/szl-build-env-acceptance.json
        run: ./verify/run-acceptance.sh

      - name: Upload five-organ acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: five-organ-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/szl-build-env-acceptance.json
          if-no-files-found: error
          retention-days: 30

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n szl describe pods || true
          kubectl -n istio-system get pods || true
